name: Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        bundler: ["2.3.5"]
        ruby:
          - "3.0.2"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2

      - name: Setup Ruby using Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}

      - name: install gems
        run: bundle install

      - name: rspec test
        run: bundle exec rake spec

      - name: mini test
        run: bundle exec rake test
